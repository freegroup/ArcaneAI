<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArcaneAI</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <link href="./assets/main.css" rel="stylesheet"/>
    <link href="./assets/bubbles.css" rel="stylesheet"/>
</head>
<body>

<div id="welcome-container">
    <div class="background-image"></div>
    <!-- Intro text comes from the game's config.json (help_text) -->
    <div class="welcome-text" id="welcomeText"></div>
    <div class="welcome-buttons">
        <button id="continueButton" hidden>Weiterspielen</button>
        <button id="startButton">Spiel starten</button>
    </div>
</div>

<div id="game-container">
    <div class="background-image"></div>
    <div id="game-status-container">
        <div>Deine Position:</div>
        <div id="game-status-value"></div>
        <button id="restartButton" class="restart-button">Neu starten</button>
    </div>
    
    <div class="game-content">
        <!-- Inventory Panel (left side) -->
        <div id="inventory-panel">
            <details open>
                <summary class="inventory-title">📦 Inventar <span id="inventory-count"></span></summary>
                <div id="inventory-list"></div>
            </details>
            <details open>
                <summary class="inventory-title">⚙️ Mögliche Funktionen <span id="function-count"></span></summary>
                <div id="function-list"></div>
            </details>
        </div>
        
        <!-- Chat Container (right side) -->
        <div class="chat-container" id="chatContainer"></div>
    </div>

    <div class="input-area" id="inputArea">
        <input type="text" id="question" placeholder="Was willst du tun?">
    </div>
</div>

<!-- Load JS modules: Controllers -->
<script src="./assets/js/inventory.js"></script>

<!-- Load JS modules: Handlers -->
<script src="./assets/js/handlers/messageHandler.js"></script>
<script src="./assets/js/handlers/jukeboxHandler.js"></script>
<script src="./assets/js/handlers/speechHandler.js"></script>
<script src="./assets/js/handlers/stateHandler.js"></script>

<!-- Load JS modules: Main App -->
<script src="./assets/js/app.js"></script>

<script>
    // Initialize app with server config
    const app = new GameApp({
        baseUri: '{{ BASE_URI }}'
    });

    // Event listeners
    document.getElementById('startButton').addEventListener('click', () => app.startGame());
    document.getElementById('continueButton').addEventListener('click', () => app.continueGame());
    document.getElementById('restartButton').addEventListener('click', () => app.restartGame());
    document.getElementById('question').addEventListener('keypress', (e) => app.handleKeyPress(e));
    app.loadGame();
</script>

</body>
</html>
